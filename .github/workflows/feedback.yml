name: Prediction Feedback

on:
  workflow_run:
    workflows:
      - CI/CD Pipeline
      - Controlled CI Failure Generator (Dev/Testing Only)
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  record-outcome:
    name: Record CI Outcome
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data directory
        run: mkdir -p data

      - name: Download prediction history artifact
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          name: prediction-history
          path: data/
          if_no_artifact_found: warn

      - name: Record workflow outcome against pending prediction
        env:
          GITHUB_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GITHUB_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: python3 -m src.prediction.gha_actions feedback

      - name: Upload updated prediction history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-history
          path: data/prediction_history.csv
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true
