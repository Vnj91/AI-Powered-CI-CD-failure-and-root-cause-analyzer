name: "CI/CD Pipeline"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: cicd-root-cause-analyzer:test

jobs:
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check .

      - name: Syntax check (compileall)
        run: python -m compileall -q .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run pytest
        run: pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  prediction-tests:
    name: Prediction Module Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Validate prediction pipeline software
        run: |
          pytest -q tests/test_prediction.py \
            -k "feature_extraction or history_store or trainer_predictor or category_model or collector_builds"

  build:
    name: Build / App Validation
    runs-on: ubuntu-latest
    needs: prediction-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile project sources
        run: python -m compileall -q app.py config.py src tests

      - name: Import validation (no live API credentials required)
        env:
          GITHUB_ACCESS_TOKEN: ""
          TAVILY_API_KEY: ""
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "app",
              "config",
              "src.graph.workflow",
              "src.graph.state",
              "src.prediction",
              "src.prediction.cli",
              "src.prediction.data_collector",
              "src.prediction.feature_extractor",
              "src.prediction.predictor",
              "src.prediction.trainer",
              "src.prediction.evaluator",
              "src.prediction.history_store",
              "src.prediction.service",
          ]

          for name in modules:
              importlib.import_module(name)
              print(f"OK {name}")
          PY

  security:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    needs: prediction-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit
        run: |
          pip-audit --desc --format json --output pip-audit-report.json
          pip-audit --desc

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: ignore

  docker-build:
    name: Docker Build & Validate
    runs-on: ubuntu-latest
    needs: [build, security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate container startup
        run: |
          set -euo pipefail
          cid="$(docker run --rm -d -p 8501:8501 --name cicd-streamlit-test "${IMAGE_NAME}")"
          cleanup() {
            docker stop "${cid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit health check passed on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done

          echo "Streamlit failed to become healthy within timeout"
          docker logs "${cid}" || true
          exit 1

  release-artifact:
    name: Release Artifact (main)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build deployment bundle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q app.py config.py src
          mkdir -p release-bundle
          tar -czf release-bundle/cicd-root-cause-analyzer.tar.gz \
            app.py config.py requirements.txt src Dockerfile README.md .env.example

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-bundle/cicd-root-cause-analyzer.tar.gz
