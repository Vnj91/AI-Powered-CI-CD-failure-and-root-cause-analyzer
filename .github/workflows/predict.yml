name: Pre-CI Failure Prediction

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  predict:
    name: Pre-CI Failure Prediction
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare artifact directories
        run: mkdir -p models data

      - name: Download latest trained model artifact
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: train-model.yml
          name: failure-predictor-model
          path: models/
          if_no_artifact_found: warn

      - name: Download prediction history artifact
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          name: prediction-history
          path: data/
          if_no_artifact_found: warn

      - name: Run pre-CI failure prediction
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m src.prediction.gha_actions predict

      - name: Upload prediction history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-history
          path: data/prediction_history.csv
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true
