name: cicd-root-cause-analyzer

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: cicd-root-cause-analyzer:local
    container_name: cicd-root-cause-analyzer
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "${APP_HOST_PORT:-8501}:8501"
    volumes:
      - analyzer-data:/home/appuser/app/data
      - analyzer-models:/home/appuser/app/models
      - analyzer-output:/home/appuser/app/output
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  analyzer-data:
  analyzer-models:
  analyzer-output:
